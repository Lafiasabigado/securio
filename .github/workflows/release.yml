name: Publish Python package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_repository:
        description: 'Target PyPI repository'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & dev tools
        working-directory: packages/python
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run unit & integration tests
        working-directory: packages/python
        run: pytest -v

  publish:
    name: Build & Publish (Trusted Publishing)
    needs: [test]
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read

    # Target environment: pypi on release or user choice on workflow_dispatch
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || github.event.inputs.target_repository }}
      url: ${{ (github.event_name == 'release' || github.event.inputs.target_repository == 'pypi') && 'https://pypi.org/p/securio' || 'https://test.pypi.org/p/securio' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build and twine
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        working-directory: packages/python
        run: python -m build

      - name: Validate distribution metadata
        working-directory: packages/python
        run: twine check dist/*

      - name: Publish package to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_repository == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: packages/python/dist/
          verbose: true

      - name: Publish package to PyPI
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_repository == 'pypi') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
          verbose: true
