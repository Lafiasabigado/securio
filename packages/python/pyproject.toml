[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securio"
version = "0.1.2"
description = "Fast, passive security health scanner for public websites"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Securio Team" }
]
keywords = [
    "security",
    "scanner",
    "passive-audit",
    "headers",
    "tls",
    "cookies",
    "cli",
    "devsecops"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Quality Assurance"
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/securio/securio"
Documentation = "https://github.com/securio/securio#readme"
Issues = "https://github.com/securio/securio/issues"

[project.scripts]
securio = "securio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["securio*"]
